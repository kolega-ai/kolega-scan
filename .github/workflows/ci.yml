name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra llm
      - name: Ruff lint
        run: uv run ruff check src tests scripts
      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra llm
      - name: Mypy (strict)
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Pytest (offline — no network / no LLM)
        run: uv run --python ${{ matrix.python-version }} --extra dev --extra llm pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run the gitleaks binary directly (matches .pre-commit-config.yaml). Avoids
      # the gitleaks-action org-license requirement.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra llm
      - name: Dependency audit
        run: uv run pip-audit

  # Live end-to-end run against the real DeepSeek API (direct backend). Runs only on
  # push to main and only when the DEEPSEEK_API_KEY secret is set — fork PRs skip it
  # (they cannot read secrets). Runs the default scanner (kolega-scan-oss-v1, 2-model DeepSeek) end-to-end
  # against a tiny inline fixture repo and enforces the coverage gate.
  test-llm:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.repository_owner == 'kolega-ai' }}
    # Map the secret to a job-level env so the step `if` can gate on it — `secrets`
    # is not allowed directly in an `if:` expression, but `env` is.
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra llm
      - name: Pytest (live LLM + coverage gate)
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        env:
          KOLEGA_LLM_LIVE: "1"
        run: uv run pytest -q --cov-fail-under=${{ vars.COVERAGE_MIN || '75' }}
