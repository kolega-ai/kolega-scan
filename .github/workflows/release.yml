name: Build release artifacts

# Builds the sdist + wheel and uploads them as CI artifacts for inspection.
# It does NOT publish anywhere — publishing to PyPI requires internal approval
# and will be added as a separate, gated step once that sign-off happens.
# Manual-trigger only (no automatic tag/push trigger).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist + wheel
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
