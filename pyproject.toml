[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "kolega-scan"
dynamic = ["version"]
description = "LLM-assisted security scanner (SAST): directory + params in, structured Semgrep-compatible JSON out."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kolega", email = "faizan@kolega.ai" }]
keywords = ["security", "sast", "scanner", "kolega"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
llm = [
    # Optional SDKs for LLM-backed scanners.
    "anthropic>=0.40",
    "openai>=1.40",
    "json-repair>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/kolega-ai/kolega-scan"
Repository = "https://github.com/kolega-ai/kolega-scan"
Issues = "https://github.com/kolega-ai/kolega-scan/issues"
Changelog = "https://github.com/kolega-ai/kolega-scan/blob/main/CHANGELOG.md"

[project.scripts]
kolega-scan = "kolega_security_scanner.cli.main:app"

[tool.hatch.version]
# Single source of truth: __version__ in the package __init__.
path = "src/kolega_security_scanner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kolega_security_scanner"]

# ---------------------------------------------------------------------------
# Ruff (lint + format) — T005
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "D"]
ignore = ["D203", "D213"]  # incompatible defaults (prefer D211/D212)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"**/__init__.py" = ["D104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy (strict) — T006
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = ["src"]
packages = ["kolega_security_scanner"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest + coverage — T007 / T022
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--cov=kolega_security_scanner --cov-report=term-missing --cov-branch"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/kolega_security_scanner"]
omit = [
    "*/__init__.py",
    "*/py.typed",
]

[tool.coverage.report]
# Offline floor. The offline suite (no LLM) covers the harness, schema, GT,
# registry, detector, and recon-AST paths. The LLM-driven claude-adaptation
# stages are covered by the live CI lane (`test-llm`, real DeepSeek); raise this
# toward 80 as the live lane lands. CI can override with --cov-fail-under.
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
